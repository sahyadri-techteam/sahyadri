# Sahyadri Connect - Jekyll Configuration

# --- Site Settings ---
url: "https://connect.sahyadrischool.org"
baseurl: ""
title: "Sahyadri Connect"
author: "Sahyadri"

# Add the website title to the title of every page
title-on-all-pages: true

# --- Navigation Bar ---
navbar-links:
  Activities: "activities"
  Krishnamurti: "kfi"
  Newsletter: "posts"
  Profiles: "profiles"
  Resources:
    - Photos: "photos"
    - Videos: "videos"
    - Ninad: "ninad"
    - Geet Gunjan: "geet"
  Information:
    - Communication: "comms"

# --- Logo & Branding ---
# Image to show in the navigation bar (works best with square image)
# avatar: "/assets/img/avatar-icon.png"

# Cut image into circle (set to false to disable)
# round-avatar: true

# Image logo in top-left corner instead of title
# title-img: /path/to/image

# --- RSS Feed ---
# Provide a description to generate RSS feed at https://<your_website>/feed.xml
rss-description:

# --- Post and Feed Settings ---
excerpt_length: 50
feed_show_excerpt: true
feed_show_tags: true

# --- Navigation & UI Settings ---
post_search: false
edit_page_button: true

# Allow sub-menu items to be longer than top-level menu items
# Prevents long words in submenus from being cut off
navbar-var-length: false

# --- Color Scheme ---
# Page background and text
page-col: "#FFFFFF"
text-col: "#3E3830"

# Links
link-col: "#A67C52"
hover-col: "#8FA186"

# Navigation bar
navbar-col: "#668571"
navbar-hover-col: "#8FA186"
navbar-text-col: "#D0DAC8"
navbar-border-col: "#BBC4B4"

# Footer
footer-col: "#B2C2AD"
footer-text-col: "#3E3830"
footer-link-col: "#A67C52"
footer-hover-col: "#668571"

# --- Background Images (Alternative to Colors) ---
# navbar-img: "/assets/img/bgimage.png"
# footer-img: "/assets/img/bgimage.png"
# page-img: "/assets/img/bgimage.png"

# --- Custom CSS ---
site-css:
  - "/assets/css/custom-styles.css"

# --- Date Format ---
date_format: "%B %-d, %Y"

# --- Markdown Settings ---
kramdown:
  input: GFM

# --- Default Layouts and Settings ---
defaults:
  # Posts
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      social-share: true

  # Activities
  - scope:
      path: ""
      type: "activities"
    values:
      layout: "events"
      comments: true
      social-share: true

  # Profiles
  - scope:
      path: ""
      type: "profiles"
    values:
      layout: "profile"
      comments: true
      social-share: true

  # Regular Pages
  - scope:
      path: ""
    values:
      layout: "page"

# --- Files to Exclude from Production ---
exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/
  - vendor/
  - node_modules/
  - .github/

# --- Plugins ---
plugins:
  - jekyll-paginate
  - jekyll-sitemap

# --- Collections ---
collections:
  posts:
    output: true
    permalink: /posts/:title

  activities:
    output: true
    permalink: /activities/:title/

  profiles:
    output: true
    permalink: /profiles/:title/
