# ==============================================================================
# COMMENT SYSTEM INTERNATIONALIZATION (i18n) CONFIGURATION
# ==============================================================================
# Multi-language dictionary file containing localized labels, form field strings,
# and system status messages for static comment plugins (e.g., Staticman).
#
# Structure & Inheritance Pattern:
# 1. Primary language codes (e.g., 'en', 'es') define the base dictionary using 
#    a YAML anchor (&DEFAULT_LANG).
# 2. Regional locale keys (e.g., 'en-US', 'es-ES') reference the base anchor 
#    via YAML merge keys (<<: *DEFAULT_LANG) to avoid code duplication while 
#    supporting locale fallback resolution.

# ------------------------------------------------------------------------------
# ENGLISH (Base & Regional Variants)
# ------------------------------------------------------------------------------
en: &DEFAULT_EN
  # Main section headers
  comments_label: "Leave a comment"
  comments_title: "Comments"
  
  # Comment entry form instruction & field labels
  comment_form_info: "Your email address will not be published. Required fields are marked"
  comment_form_comment_label: "Comment"
  comment_form_md_info: "Markdown is supported."
  comment_form_name_label: "Name"
  comment_form_email_label: "Email address"
  comment_form_website_label: "Website (optional)"
  
  # Form actions and status responses
  comment_btn_submit: "Submit comment"
  comment_btn_submitted: "Submitted"
  comment_success_msg: "Thanks for your comment! It will show on the site once it has been approved."
  comment_error_msg: "Sorry, there was an error with your submission. Please make sure all required fields have been completed and try again."

